services:
  gitbox:
    image: semanticrelease/docker-gitbox:latest@sha256:c0c2a595740e070c4b4dbe5bcd389da21e670008958967e74cd1a9ba8bcb3afa
    tty: true
    stdin_open: true
    ports:
      - "80"

  npm-registry:
    image: verdaccio/verdaccio:6.11.3@sha256:8c9cd40d28ef134140f4f6c4cef2032ac58bd554cce56757048f81b72717c09c
    ports:
      - "4873"
    volumes:
      - ./config.yaml:/verdaccio/conf/config.yaml:ro

  mockserver:
    image: mockserver/mockserver:7.6.0@sha256:80b3b1a26f3553d0c81a3f3896b5b7274c17b2a2e52f0fd2b28e246bc9efa290
    ports:
      - "1080"
